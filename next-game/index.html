<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Next Game Prototype</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Next Game Prototype</h1>
    <p>WASD / Arrow keys support ready</p>
  </header>

  <main class="stage-wrap">
    <canvas id="game" width="1280" height="720" aria-label="game canvas"></canvas>
  </main>

  <footer class="help">
    <span>Move: A D or ArrowLeft ArrowRight</span>
    <span>Jump: W or ArrowUp</span>
    <span>Action: Space</span>
    <span>Reset: R</span>
  </footer>

  <script src="./game.js"></script>
</body>
</html>
