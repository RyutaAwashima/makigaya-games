<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Sky Clash 2D</title>
	<style>
		:root {
			--bg-top: #ffe9b3;
			--bg-mid: #ffc97a;
			--bg-bottom: #ff9a6a;
			--ink: #1f1f28;
			--ui-card: rgba(255, 255, 255, 0.78);
			--ui-border: rgba(31, 31, 40, 0.2);
			--accent-a: #0a7ea4;
			--accent-b: #c33a65;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			color: var(--ink);
			font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
			background:
				radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.75), transparent 38%),
				radial-gradient(circle at 80% 8%, rgba(255, 255, 255, 0.4), transparent 42%),
				linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 45%, var(--bg-bottom) 100%);
			display: grid;
			place-items: center;
			padding: 18px;
		}

		.wrap {
			width: min(1100px, 96vw);
			display: grid;
			gap: 10px;
		}

		.hud {
			display: grid;
			grid-template-columns: 1fr auto 1fr;
			gap: 10px;
			align-items: center;
		}

		.panel {
			background: var(--ui-card);
			border: 1px solid var(--ui-border);
			border-radius: 14px;
			padding: 10px 12px;
			box-shadow: 0 10px 24px rgba(16, 22, 34, 0.12);
			backdrop-filter: blur(4px);
		}

		.p1 {
			justify-self: start;
			border-left: 6px solid var(--accent-a);
		}

		.p2 {
			justify-self: end;
			text-align: right;
			border-right: 6px solid var(--accent-b);
		}

		.center {
			font-weight: 700;
			letter-spacing: 0.04em;
			text-transform: uppercase;
			font-size: 0.86rem;
			opacity: 0.9;
			text-align: center;
		}

		.name {
			font-weight: 700;
			text-transform: uppercase;
			font-size: 0.8rem;
			letter-spacing: 0.07em;
			opacity: 0.85;
			margin-bottom: 4px;
		}

		.stat {
			font-size: 1.45rem;
			line-height: 1;
			font-weight: 800;
		}

		.stocks {
			font-size: 0.82rem;
			margin-top: 4px;
			opacity: 0.85;
			letter-spacing: 0.04em;
		}

		.stage {
			position: relative;
			border-radius: 18px;
			overflow: hidden;
			border: 1px solid rgba(20, 20, 28, 0.24);
			box-shadow: 0 20px 40px rgba(17, 12, 24, 0.24);
		}

		canvas {
			display: block;
			width: 100%;
			height: auto;
			aspect-ratio: 16 / 9;
			background: transparent;
		}

		.help {
			font-size: 0.82rem;
			background: var(--ui-card);
			border: 1px solid var(--ui-border);
			border-radius: 14px;
			padding: 8px 12px;
			line-height: 1.5;
		}

		.help strong {
			letter-spacing: 0.03em;
		}

		@media (max-width: 800px) {
			.hud {
				grid-template-columns: 1fr;
			}

			.p2 {
				justify-self: start;
				text-align: left;
				border-right: 0;
				border-left: 6px solid var(--accent-b);
			}

			.center {
				order: -1;
			}
		}
	</style>
</head>
<body>
	<div class="wrap">
		<div class="hud">
			<div class="panel p1">
				<div class="name">P1</div>
				<div id="p1Damage" class="stat">0%</div>
				<div id="p1Stocks" class="stocks">STOCKS: 3</div>
			</div>
			<div class="panel center" id="status">Fight</div>
			<div class="panel p2">
				<div class="name">P2</div>
				<div id="p2Damage" class="stat">0%</div>
				<div id="p2Stocks" class="stocks">STOCKS: 3</div>
			</div>
		</div>

		<div class="stage">
			<canvas id="game" width="960" height="540"></canvas>
		</div>

		<div class="help">
			<strong>P1:</strong> A/D move, W jump, F attack, S projectile, Q smash
			| <strong>P2:</strong> CPU Fighter
			| First to take all 3 stocks wins. Press R to restart.
		</div>
	</div>

	<script>
		const canvas = document.getElementById("game");
		const ctx = canvas.getContext("2d");

		const ui = {
			p1Damage: document.getElementById("p1Damage"),
			p2Damage: document.getElementById("p2Damage"),
			p1Stocks: document.getElementById("p1Stocks"),
			p2Stocks: document.getElementById("p2Stocks"),
			status: document.getElementById("status")
		};

		const W = canvas.width;
		const H = canvas.height;

		const WORLD = {
			gravity: 0.42,
			floorY: 470,
			leftBlast: -210,
			rightBlast: W + 210,
			bottomBlast: H + 220,
			topBlast: -280
		};

		const PLATFORMS = [
			{ x: 150, y: 375, w: 190, h: 16 },
			{ x: 620, y: 375, w: 190, h: 16 },
			{ x: 385, y: 300, w: 190, h: 16 }
		];

		const keys = new Set();
		const blockedKeys = new Set(["w", "a", "d", "f", "s", "q", "r"]);

		window.addEventListener("keydown", (e) => {
			const k = e.key.toLowerCase();
			if (blockedKeys.has(k)) e.preventDefault();
			keys.add(k);

			if (k === "r" && game.over) {
				resetMatch();
			}
		});

		window.addEventListener("keyup", (e) => {
			keys.delete(e.key.toLowerCase());
		});

		function mkPlayer(id, color, controls, spawnX) {
			return {
				id,
				color,
				controls,
				x: spawnX,
				y: 60,
				w: 38,
				h: 58,
				vx: 0,
				vy: 0,
				face: id === 1 ? 1 : -1,
				speed: 1.02,
				jumpPower: 9.5,
				grounded: false,
				airJumps: 1,
				maxAirJumps: 1,
				damage: 0,
				stocks: 3,
				hitstun: 0,
				invuln: 0,
				attackCooldown: 0,
				attackBuffer: 0,
				hurtFlash: 0,
				respawnTimer: 0,
				_jumpHeld: false,
				_attackHeld: false,
				_specialHeld: false,
				_smashHeld: false
			};
		}

		const game = {
			over: false,
			winner: null,
			impact: 0,
			attacks: [],
			projectiles: []
		};

		const p1 = mkPlayer(1, "#0a7ea4", { left: "a", right: "d", jump: "w", attack: "f", special: "s", smash: "q" }, 250);
		const p2 = mkPlayer(2, "#c33a65", { left: "j", right: "l", jump: "i", attack: "h" }, 710);

		function resetFighter(p, x) {
			p.x = x;
			p.y = 60;
			p.vx = 0;
			p.vy = 0;
			p.face = p.id === 1 ? 1 : -1;
			p.damage = 0;
			p.hitstun = 0;
			p.invuln = 90;
			p.hurtFlash = 0;
			p.grounded = false;
			p.airJumps = p.maxAirJumps;
			p.attackCooldown = 0;
			p.respawnTimer = 0;
			p._jumpHeld = false;
			p._attackHeld = false;
			p._specialHeld = false;
			p._smashHeld = false;
		}

		function resetMatch() {
			p1.stocks = 3;
			p2.stocks = 3;
			resetFighter(p1, 250);
			resetFighter(p2, 710);
			game.over = false;
			game.winner = null;
			game.attacks = [];
			game.projectiles = [];
			game.impact = 0;
			ui.status.textContent = "Fight";
		}

		function intersects(a, b) {
			return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
		}

		function spawnAttack(p) {
			const reach = 42;
			const box = {
				type: "jab",
				owner: p,
				x: p.face === 1 ? p.x + p.w : p.x - reach,
				y: p.y + 14,
				w: reach,
				h: 24,
				ttl: 7,
				damage: 10,
				kbBase: 6.1,
				kbScale: 0.1,
				kbX: 1.34,
				kbY: 0.2
			};
			game.attacks.push(box);
			p.attackCooldown = 22;
			p.attackBuffer = 3;
		}

		function spawnSmash(p) {
			const reach = 72;
			const box = {
				type: "smash",
				owner: p,
				x: p.face === 1 ? p.x + p.w - 4 : p.x - reach + 4,
				y: p.y + 10,
				w: reach,
				h: 36,
				ttl: 10,
				damage: 36,
				kbBase: 16.5,
				kbScale: 0.22,
				kbX: 2.7,
				kbY: 0.07
			};
			game.attacks.push(box);
			p.attackCooldown = 48;
			p.attackBuffer = 7;
		}

		function spawnProjectile(p) {
			const projectile = {
				owner: p,
				x: p.face === 1 ? p.x + p.w + 2 : p.x - 16,
				y: p.y + 22,
				w: 16,
				h: 10,
				vx: p.face * 7.4,
				ttl: 95,
				damage: 8,
				kbBase: 6.4,
				kbScale: 0.1,
				kbX: 1.5,
				kbY: 0.15
			};
			game.projectiles.push(projectile);
			p.attackCooldown = 28;
			p.attackBuffer = 4;
		}

		function applyHit(attack, target) {
			if (target.invuln > 0 || target.respawnTimer > 0) return;

			const dir = attack.owner.face;
			const k = (attack.kbBase + target.damage * attack.kbScale) * 1.22;
			const kbX = attack.kbX ?? 1.18;
			const kbY = attack.kbY ?? 0.2;
			const sideBlastBoost = 1.32;
			target.damage = Math.min(999, target.damage + attack.damage);
			target.vx = dir * (k * kbX * sideBlastBoost);
			target.vy = -(k * kbY) - 0.7;
			target.hitstun = Math.floor(8 + target.damage * 0.14);
			target.invuln = 11;
			target.hurtFlash = 8;
			game.impact = 6;
		}

		function runControls(p) {
			if (p.respawnTimer > 0 || game.over) return;

			const left = keys.has(p.controls.left);
			const right = keys.has(p.controls.right);
			const jump = keys.has(p.controls.jump);
			const attack = keys.has(p.controls.attack);
			const special = !!p.controls.special && keys.has(p.controls.special);
			const smash = !!p.controls.smash && keys.has(p.controls.smash);

			if (p.hitstun <= 0) {
				if (left) {
					p.vx -= p.speed;
					p.face = -1;
				}
				if (right) {
					p.vx += p.speed;
					p.face = 1;
				}

				if (jump && !p._jumpHeld) {
					if (p.grounded) {
						p.vy = -p.jumpPower;
						p.grounded = false;
					} else if (p.airJumps > 0) {
						p.vy = -p.jumpPower * 0.95;
						p.airJumps -= 1;
					}
				}

				if (attack && !p._attackHeld && p.attackCooldown <= 0) {
					spawnAttack(p);
				}

				if (special && !p._specialHeld && p.attackCooldown <= 0) {
					spawnProjectile(p);
				}

				if (smash && !p._smashHeld && p.attackCooldown <= 0) {
					spawnSmash(p);
				}
			}

			p._jumpHeld = jump;
			p._attackHeld = attack;
			p._specialHeld = special;
			p._smashHeld = smash;
		}

		function runCpuControls(p, target) {
			if (p.respawnTimer > 0 || game.over) return;

			if (p.hitstun > 0) return;

			const pCenterX = p.x + p.w * 0.5;
			const tCenterX = target.x + target.w * 0.5;
			const dx = tCenterX - pCenterX;
			const adx = Math.abs(dx);
			const dy = target.y - p.y;

			const edgeGuard = 60;
			if (p.x < edgeGuard) {
				p.vx += p.speed;
				p.face = 1;
			} else if (p.x + p.w > W - edgeGuard) {
				p.vx -= p.speed;
				p.face = -1;
			} else {
				const keepDistance = 42;
				if (adx > keepDistance + 14) {
					if (dx < 0) {
						p.vx -= p.speed;
						p.face = -1;
					} else {
						p.vx += p.speed;
						p.face = 1;
					}
				}
			}

			if (p.grounded && dy < -42 && Math.random() < 0.08) {
				p.vy = -p.jumpPower;
				p.grounded = false;
			}

			const needsRecoveryJump = !p.grounded && p.y > WORLD.floorY - 120 && p.vy > 1.2;
			if (needsRecoveryJump && p.airJumps > 0) {
				p.vy = -p.jumpPower * 0.95;
				p.airJumps -= 1;
			}

			const inRange = adx < 70 && Math.abs(dy) < 46;
			const smashRange = adx < 52 && Math.abs(dy) < 34;
			if (inRange && p.attackCooldown <= 0 && Math.random() < 0.35) {
				spawnAttack(p);
			} else if (smashRange && p.attackCooldown <= 0 && Math.random() < 0.14) {
				spawnSmash(p);
			}
		}

		function resolveStageCollision(p) {
			p.grounded = false;

			if (p.y + p.h >= WORLD.floorY) {
				p.y = WORLD.floorY - p.h;
				p.vy = 0;
				p.grounded = true;
				p.airJumps = p.maxAirJumps;
			}

			for (const plat of PLATFORMS) {
				const wasAbove = p.y + p.h - p.vy <= plat.y;
				const willOverlapX = p.x + p.w > plat.x && p.x < plat.x + plat.w;

				if (willOverlapX && wasAbove && p.y + p.h >= plat.y && p.y + p.h <= plat.y + plat.h + 10 && p.vy >= 0) {
					p.y = plat.y - p.h;
					p.vy = 0;
					p.grounded = true;
					p.airJumps = p.maxAirJumps;
				}
			}
		}

		function updatePlayer(p, inputMode, target) {
			if (p.respawnTimer > 0) {
				p.respawnTimer -= 1;
				if (p.respawnTimer <= 0) {
					const spawnX = p.id === 1 ? 250 : 710;
					resetFighter(p, spawnX);
				}
				return;
			}

			if (inputMode === "cpu") {
				runCpuControls(p, target);
			} else {
				runControls(p);
			}

			if (p.hitstun > 0) p.hitstun -= 1;
			if (p.invuln > 0) p.invuln -= 1;
			if (p.attackCooldown > 0) p.attackCooldown -= 1;
			if (p.attackBuffer > 0) p.attackBuffer -= 1;
			if (p.hurtFlash > 0) p.hurtFlash -= 1;

			p.vy += WORLD.gravity;

			const maxH = p.hitstun > 0 ? 10.2 : 7.6;
			if (p.vx > maxH) p.vx = maxH;
			if (p.vx < -maxH) p.vx = -maxH;

			const drag = p.grounded ? 0.77 : 0.92;
			p.vx *= drag;

			p.x += p.vx;
			p.y += p.vy;

			resolveStageCollision(p);

			const blastOut =
				p.x + p.w < WORLD.leftBlast ||
				p.x > WORLD.rightBlast ||
				p.y > WORLD.bottomBlast ||
				p.y + p.h < WORLD.topBlast;

			if (blastOut && !game.over) {
				p.stocks -= 1;
				if (p.stocks <= 0) {
					game.over = true;
					game.winner = p.id === 1 ? 2 : 1;
					ui.status.textContent = "P" + game.winner + " Wins - Press R";
				} else {
					p.respawnTimer = 75;
				}
			}
		}

		function updateAttacks() {
			for (let i = game.attacks.length - 1; i >= 0; i -= 1) {
				const a = game.attacks[i];
				a.ttl -= 1;

				const target = a.owner === p1 ? p2 : p1;
				const hurtbox = { x: target.x, y: target.y, w: target.w, h: target.h };

				if (a.ttl > 0 && intersects(a, hurtbox)) {
					applyHit(a, target);
					a.ttl = 0;
				}

				if (a.ttl <= 0) game.attacks.splice(i, 1);
			}
		}

		function updateProjectiles() {
			for (let i = game.projectiles.length - 1; i >= 0; i -= 1) {
				const b = game.projectiles[i];
				b.x += b.vx;
				b.ttl -= 1;

				const target = b.owner === p1 ? p2 : p1;
				const hurtbox = { x: target.x, y: target.y, w: target.w, h: target.h };

				if (b.ttl > 0 && intersects(b, hurtbox)) {
					applyHit(b, target);
					b.ttl = 0;
				}

				const out = b.x + b.w < -40 || b.x > W + 40;
				if (b.ttl <= 0 || out) game.projectiles.splice(i, 1);
			}
		}

		function drawBackground(t) {
			const g = ctx.createLinearGradient(0, 0, 0, H);
			g.addColorStop(0, "#ffe9b3");
			g.addColorStop(0.45, "#ffc97a");
			g.addColorStop(1, "#ff9a6a");
			ctx.fillStyle = g;
			ctx.fillRect(0, 0, W, H);

			ctx.save();
			const drift = Math.sin(t * 0.00035) * 14;
			ctx.globalAlpha = 0.45;
			ctx.fillStyle = "#fff8e8";
			ctx.beginPath();
			ctx.ellipse(180 + drift, 105, 150, 60, 0, 0, Math.PI * 2);
			ctx.ellipse(740 - drift * 0.7, 90, 170, 74, 0, 0, Math.PI * 2);
			ctx.fill();
			ctx.restore();

			for (let i = 0; i < 7; i += 1) {
				ctx.fillStyle = "rgba(255,255,255,0.09)";
				ctx.fillRect(0, i * 80 + (t * 0.02 % 18), W, 1);
			}
		}

		function drawStage() {
			ctx.fillStyle = "#f0f8ff";
			ctx.fillRect(0, WORLD.floorY, W, H - WORLD.floorY);

			ctx.fillStyle = "#9dc2d8";
			ctx.fillRect(0, WORLD.floorY + 9, W, H - WORLD.floorY);

			for (const p of PLATFORMS) {
				ctx.fillStyle = "#f0f8ff";
				ctx.fillRect(p.x, p.y, p.w, p.h);
				ctx.fillStyle = "#9dc2d8";
				ctx.fillRect(p.x, p.y + p.h - 5, p.w, 5);
			}
		}

		function drawPlayer(p) {
			if (p.respawnTimer > 0) {
				if (Math.floor(p.respawnTimer / 7) % 2 === 0) return;
			}

			ctx.save();

			if (p.invuln > 0 && Math.floor(p.invuln / 4) % 2 === 0) {
				ctx.globalAlpha = 0.55;
			}

			const bob = p.grounded ? 0 : Math.sin(performance.now() * 0.02) * 0.6;
			const x = p.x;
			const y = p.y + bob;

			ctx.fillStyle = p.hurtFlash > 0 ? "#fff0f0" : p.color;
			ctx.fillRect(x, y, p.w, p.h);

			ctx.fillStyle = "rgba(0,0,0,0.2)";
			ctx.fillRect(x, y + p.h - 8, p.w, 8);

			ctx.fillStyle = "#111";
			const eyeX = p.face === 1 ? x + p.w - 10 : x + 6;
			ctx.fillRect(eyeX, y + 16, 4, 4);

			if (p.attackBuffer > 0) {
				ctx.strokeStyle = "rgba(255,255,255,0.92)";
				ctx.lineWidth = 3;
				const cx = p.face === 1 ? x + p.w + 9 : x - 9;
				const arcRadius = Math.max(2, 9 + (3 - p.attackBuffer) * 5);
				ctx.beginPath();
				ctx.arc(cx, y + 24, arcRadius, 0.2, Math.PI * 1.8);
				ctx.stroke();
			}

			ctx.restore();
		}

		function drawAttacks() {
			ctx.save();
			ctx.fillStyle = "rgba(255,255,255,0.28)";
			for (const a of game.attacks) {
				ctx.fillRect(a.x, a.y, a.w, a.h);
			}
			ctx.restore();
		}

		function drawProjectiles() {
			ctx.save();
			for (const b of game.projectiles) {
				const grad = ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y);
				grad.addColorStop(0, "#f8ffcf");
				grad.addColorStop(1, "#ffb86b");
				ctx.fillStyle = grad;
				ctx.fillRect(b.x, b.y, b.w, b.h);
				ctx.fillStyle = "rgba(255,255,255,0.6)";
				ctx.fillRect(b.x + 3, b.y + 2, b.w - 6, 2);
			}
			ctx.restore();
		}

		function updateUI() {
			ui.p1Damage.textContent = Math.floor(p1.damage) + "%";
			ui.p2Damage.textContent = Math.floor(p2.damage) + "%";
			ui.p1Stocks.textContent = "STOCKS: " + p1.stocks;
			ui.p2Stocks.textContent = "STOCKS: " + p2.stocks;
			if (!game.over) ui.status.textContent = "Fight";
		}

		function step(t) {
			if (!game.over) {
				updatePlayer(p1, "human", p2);
				updatePlayer(p2, "cpu", p1);
				updateAttacks();
				updateProjectiles();
			}

			if (game.impact > 0) game.impact -= 1;
			updateUI();

			ctx.save();
			if (game.impact > 0) {
				const s = game.impact;
				ctx.translate((Math.random() - 0.5) * s * 1.2, (Math.random() - 0.5) * s * 1.2);
			}

			drawBackground(t);
			drawStage();
			drawAttacks();
			drawProjectiles();
			drawPlayer(p1);
			drawPlayer(p2);
			ctx.restore();

			if (game.over) {
				ctx.save();
				ctx.fillStyle = "rgba(10,12,20,0.45)";
				ctx.fillRect(0, 0, W, H);
				ctx.fillStyle = "#fff";
				ctx.textAlign = "center";
				ctx.font = "bold 54px Trebuchet MS";
				ctx.fillText("P" + game.winner + " Wins", W / 2, H / 2 - 8);
				ctx.font = "bold 24px Trebuchet MS";
				ctx.fillText("Press R to Restart", W / 2, H / 2 + 36);
				ctx.restore();
			}

			requestAnimationFrame(step);
		}

		resetMatch();
		requestAnimationFrame(step);
	</script>
</body>
</html>
