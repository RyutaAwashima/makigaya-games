<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Puyo Battle</title>
  <style>
    :root { --ink: #17202b; --line: rgba(23, 32, 43, .2); --panel: rgba(255, 255, 255, .84); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 14px; color: var(--ink); font-family: "Trebuchet MS", "Yu Gothic", sans-serif; background: radial-gradient(circle at 15% 12%, #fff8ef 0, transparent 35%), linear-gradient(150deg, #f7d6b5, #a9d7e9 72%, #7db6bd); }
    .app { width: min(1120px, 98vw); display: grid; gap: 10px; }
    .header, .help { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(4px); }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .title { font-size: 1.2rem; font-weight: 800; letter-spacing: .03em; }
    .status { padding: 5px 11px; border: 1px solid rgba(29, 125, 179, .35); border-radius: 999px; color: #0b537b; background: rgba(255,255,255,.7); font-weight: 700; }
    .settings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: .84rem; }
    .settings label { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .settings select { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; color: var(--ink); background: #fff; }
    .setup { display: grid; gap: 18px; padding: 28px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 16px 34px rgba(15,22,40,.18); }
    .setup h2 { margin: 0; font-size: 1.6rem; }
    .setup p { margin: 0; color: #405568; }
    .setup .settings { gap: 14px 18px; font-size: 1rem; }
    .start-button { width: fit-content; border: 0; border-radius: 8px; padding: 11px 22px; color: #fff; background: #1d7db3; font: 800 1rem "Trebuchet MS", "Yu Gothic", sans-serif; cursor: pointer; box-shadow: 0 5px 0 #145b80; }
    .start-button:active { transform: translateY(3px); box-shadow: 0 2px 0 #145b80; }
    .game-ui { display: none; }
    body.started .setup { display: none; }
    body.started .game-ui { display: block; }
    .stage-wrap { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: #b9e2ef; box-shadow: 0 16px 34px rgba(15,22,40,.2); }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; }
    .help { display: flex; flex-wrap: wrap; gap: 8px 16px; line-height: 1.45; font-size: .88rem; }
    .touch-controls { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(4px); gap: 12px; align-items: center; justify-content: center; }
    .touch-controls .touch-group { display: flex; gap: 6px; align-items: center; }
    .touch-btn { display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 54px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.72); color: var(--ink); font-size: 1.4rem; font-weight: 700; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-shadow: 0 3px 0 rgba(0,0,0,.12); transition: transform .06s, box-shadow .06s; }
    .touch-btn:active, .touch-btn.active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.12); background: rgba(200,220,240,.9); }
    .touch-btn.wide { width: 80px; font-size: 1rem; }
    .touch-btn.drop { background: rgba(29,125,179,.25); border-color: rgba(29,125,179,.4); }
    .touch-btn.drop:active, .touch-btn.drop.active { background: rgba(29,125,179,.45); }
    .touch-btn.restart { width: 54px; font-size: .85rem; background: rgba(255,93,115,.15); border-color: rgba(255,93,115,.3); }
    .touch-btn.restart:active, .touch-btn.restart.active { background: rgba(255,93,115,.35); }
    .touch-sep { width: 1px; height: 40px; background: var(--line); margin: 0 4px; }
    body.touch-device .touch-controls { display: flex; }
    @media (pointer: coarse) { .touch-controls { display: flex; } }
    @media (max-width: 700px) { .title { font-size: 1rem; } .status { font-size: .82rem; } .help { font-size: .78rem; } .touch-btn { width: 46px; height: 46px; font-size: 1.2rem; } .touch-btn.wide { width: 68px; font-size: .85rem; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="header"><div class="title">Mini Puyo Battle</div><div class="status" id="status">SETTING</div></div>
    <section class="setup" id="setup"><h2>対戦設定</h2><p>プレイスタイルとCPUの強さを選んでください。</p><div class="settings"><label>モード <select id="mode"><option value="cpu">CPU戦</option><option value="solo">個人戦</option></select></label><label>CPUレベル <select id="cpuLevel"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select></label><label><input id="garbage" type="checkbox" checked /> お邪魔ぷよあり</label></div><button class="start-button" id="startButton" type="button">対戦開始</button></section>
    <div class="stage-wrap game-ui"><canvas id="game" width="1120" height="700" aria-label="ぷよぷよ CPU対戦ゲーム"></canvas></div>
    <div class="help game-ui"><span><strong>PLAYER:</strong> ← → 移動 / ↓ 落下 / Z X 回転 / Space 落とす</span><span><strong>連鎖:</strong> おじゃまぷよを相手へ送ります</span><span><strong>R:</strong> 再スタート</span></div>
    <div class="touch-controls game-ui" id="touchControls">
      <div class="touch-group">
        <button class="touch-btn" data-key="arrowleft" aria-label="左移動">◀</button>
        <button class="touch-btn" data-key="arrowdown" aria-label="下移動">▼</button>
        <button class="touch-btn" data-key="arrowright" aria-label="右移動">▶</button>
      </div>
      <div class="touch-sep"></div>
      <div class="touch-group">
        <button class="touch-btn" data-key="z" aria-label="左回転">↺</button>
        <button class="touch-btn" data-key="x" aria-label="右回転">↻</button>
      </div>
      <div class="touch-sep"></div>
      <div class="touch-group">
        <button class="touch-btn wide drop" data-key=" " aria-label="落とす">ドロップ</button>
      </div>
      <div class="touch-sep"></div>
      <div class="touch-group">
        <button class="touch-btn restart" data-key="r" aria-label="再スタート">再戦</button>
      </div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const COLS = 6, ROWS = 14, VISIBLE_ROWS = 12, CELL = 38, BOARD_Y = 150, DROP_FRAMES = 30, GARBAGE = 5;
    const COLORS = ["#ff5d73", "#3c9bff", "#ffd74d", "#58c87b", "#b36df2", "#95a3ad"];
    const player = makeGame("PLAYER"), cpu = makeGame("CPU");
    const match = { over: false, winner: "" };
    const effects = [];
    const settings = { mode: "cpu", cpuLevel: 5, garbage: true };
    const modeEl = document.getElementById("mode"), cpuLevelEl = document.getElementById("cpuLevel"), garbageEl = document.getElementById("garbage"), startButton = document.getElementById("startButton");
    const held = new Set(), once = new Set();

    function makeBoard() { return Array.from({ length: ROWS }, () => Array(COLS).fill(null)); }
    function makeGame(name) { return { name, board: makeBoard(), current: null, next: null, score: 0, chain: 0, lastClear: 0, garbage: 0, frame: 0, lockDelay: 0, aiMove: null, aiWait: 0, gameOver: false }; }
    function randColor() { return Math.floor(Math.random() * 5); }
    function makePair() { return { x: 2, y: 1, dx: 0, dy: -1, c1: randColor(), c2: randColor() }; }
    function cells(pair) { return [{ x: pair.x, y: pair.y, color: pair.c1 }, { x: pair.x + pair.dx, y: pair.y + pair.dy, color: pair.c2 }]; }
    function inside(x, y) { return x >= 0 && x < COLS && y < ROWS; }
    function canOccupy(game, x, y) { return inside(x, y) && (y < 0 || game.board[y][x] === null); }
    function canPlace(game, pair) { return cells(pair).every((c) => canOccupy(game, c.x, c.y)); }
    function resetGame(game) { game.board = makeBoard(); game.current = makePair(); game.next = makePair(); game.score = 0; game.chain = 0; game.lastClear = 0; game.garbage = 0; game.frame = 0; game.lockDelay = 0; game.aiMove = null; game.aiWait = 0; game.gameOver = !canPlace(game, game.current); }
    function resetMatch() { resetGame(player); resetGame(cpu); effects.length = 0; match.over = false; match.winner = ""; statusEl.textContent = settings.mode === "cpu" ? "PLAYER VS CPU" : "SOLO PLAY"; }
    function movePair(game, dx, dy) { const moved = { ...game.current, x: game.current.x + dx, y: game.current.y + dy }; if (!canPlace(game, moved)) return false; game.current = moved; return true; }
    function rotatePair(game, direction) { const p = game.current; const rotated = { ...p, dx: -p.dy * direction, dy: p.dx * direction }; if (canPlace(game, rotated)) { game.current = rotated; return true; } for (const kick of [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }]) { const kicked = { ...rotated, x: rotated.x + kick.x, y: rotated.y + kick.y }; if (canPlace(game, kicked)) { game.current = kicked; return true; } } return false; }
    function clearGroup(game, startX, startY, visited) { const color = game.board[startY][startX]; if (color === null || color === GARBAGE) return []; const stack = [{ x: startX, y: startY }], group = []; visited[startY][startX] = true; while (stack.length) { const node = stack.pop(); group.push(node); for (const d of [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }]) { const x = node.x + d.x, y = node.y + d.y; if (inside(x, y) && y >= 0 && !visited[y][x] && game.board[y][x] === color) { visited[y][x] = true; stack.push({ x, y }); } } } return group; }
    function applyGravity(game) { let moved = false; for (let y = ROWS - 2; y >= 0; y--) for (let x = 0; x < COLS; x++) if (game.board[y][x] !== null && game.board[y + 1][x] === null) { game.board[y + 1][x] = game.board[y][x]; game.board[y][x] = null; moved = true; } return moved; }
    function clearGroups(game, animate = true, chain = 1) { const visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false)), cleared = []; for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (game.board[y][x] !== null && !visited[y][x]) { const group = clearGroup(game, x, y, visited); if (group.length >= 4) cleared.push(...group.map((cell) => ({ ...cell, color: game.board[cell.y][cell.x] }))); } if (animate && cleared.length) spawnFireworks(game, cleared, chain); for (const c of cleared) game.board[c.y][c.x] = null; return cleared.length; }
    function resolve(game, animate = true) { let chain = 0, total = 0; while (true) { while (applyGravity(game)); const cleared = clearGroups(game, animate, chain + 1); if (!cleared) break; chain++; total += cleared; game.score += cleared * 12 + chain * chain * 40; } game.chain = chain; game.lastClear = total; return { cleared: total, chain }; }
    function spawnFireworks(game, cleared, chain) { const boardX = game === player ? 120 : 690; const offset = ROWS - VISIBLE_ROWS; const blobs = cleared.filter((cell) => cell.y >= offset).map((cell) => ({ x: boardX + cell.x * CELL, y: BOARD_Y + (cell.y - offset) * CELL, color: cell.color })); const count = Math.min(14, 2 + Math.ceil(cleared.length / 3) + chain * chain); for (let burst = 0; burst < count; burst++) { const centerX = boardX + 12 + Math.random() * (COLS * CELL - 24); const centerY = BOARD_Y + 42 + Math.random() * (VISIBLE_ROWS * CELL - 100); const color = Math.floor(Math.random() * 5); const particles = []; const particleCount = 20 + chain * 12 + Math.floor(cleared.length * 1.5); for (let i = 0; i < particleCount; i++) { const angle = Math.PI * 2 * i / particleCount + Math.random() * .16; const speed = 1.4 + Math.random() * (2.4 + chain * .65); particles.push({ x: centerX, y: centerY, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 28 + Math.random() * 18, size: 1.5 + Math.random() * 2.5 }); } effects.push({ x: centerX, y: centerY, color, blobs, particles, life: 58, flash: 1 }); } }
    function updateEffects() { for (let i = effects.length - 1; i >= 0; i--) { const effect = effects[i]; effect.life--; effect.flash *= .88; for (const particle of effect.particles) { particle.x += particle.vx; particle.y += particle.vy; particle.vx *= .97; particle.vy = particle.vy * .97 + .045; particle.life--; } if (effect.life <= 0) effects.splice(i, 1); } }
    function drawEffects() { ctx.save(); ctx.globalCompositeOperation = "lighter"; for (const effect of effects) { const alpha = Math.max(0, effect.life / 58); if (effect.life > 22 && Math.floor(effect.life / 4) % 2 === 0) for (const blob of effect.blobs) drawBlob(blob.x, blob.y, blob.color, .9); if (effect.flash > .05) { ctx.fillStyle = `rgba(255,255,255,${effect.flash * .45})`; ctx.beginPath(); ctx.arc(effect.x, effect.y, 24 + (1 - alpha) * 28, 0, Math.PI * 2); ctx.fill(); } if (effect.life <= 42) for (const particle of effect.particles) { if (particle.life <= 0) continue; const particleAlpha = Math.min(1, particle.life / 12) * alpha; ctx.fillStyle = `${COLORS[effect.color]}`; ctx.globalAlpha = particleAlpha; ctx.beginPath(); ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(particle.x, particle.y); ctx.lineTo(particle.x - particle.vx * 3, particle.y - particle.vy * 3); ctx.stroke(); } } ctx.restore(); }
    function addGarbage(game) { while (game.garbage > 0) { let placed = false; for (let x = 0; x < COLS && game.garbage > 0; x++) for (let y = ROWS - 1; y >= 0 && game.garbage > 0; y--) if (game.board[y][x] === null) { game.board[y][x] = GARBAGE; game.garbage--; placed = true; break; } if (!placed) { game.gameOver = true; break; } } }
    function placePair(game, animate = true) { for (const c of cells(game.current)) { if (c.y < 0) { game.gameOver = true; return { cleared: 0, chain: 0 }; } game.board[c.y][c.x] = c.color; } const result = resolve(game, animate); game.current = game.next; game.current.x = 2; game.current.y = 1; game.current.dx = 0; game.current.dy = -1; game.next = makePair(); addGarbage(game); if (!canPlace(game, game.current)) game.gameOver = true; return result; }
    function sendGarbage(to, result) { if (settings.garbage && settings.mode === "cpu") to.garbage += Math.max(0, Math.floor((result.cleared + result.chain * 2) / 4)); }
    function copyGame(game) { return { board: game.board.map((row) => [...row]), current: { ...game.current }, next: game.next, score: 0, chain: 0, garbage: 0 }; }
    function simulate(game, x, rotation) { const test = copyGame(game); test.current.x = x; test.current.y = 1; test.current.dx = [0, 1, 0, -1][rotation]; test.current.dy = [-1, 0, 1, 0][rotation]; if (!canPlace(test, test.current)) return null; while (movePair(test, 0, 1)); const result = placePair(test, false); let height = 0, holes = 0; for (let col = 0; col < COLS; col++) { let found = false; for (let y = 0; y < ROWS; y++) { if (test.board[y][col] !== null) { found = true; height += ROWS - y; } else if (found) holes++; } } return { x, rotation, value: result.cleared * 100 + result.chain * 500 - height * 2 - holes * 30 }; }
    function chooseCpuMove(game) { let best = null; const noise = (10 - settings.cpuLevel) * 35; for (let rotation = 0; rotation < 4; rotation++) for (let x = 0; x < COLS; x++) { const candidate = simulate(game, x, rotation); if (candidate) { candidate.value += Math.random() * noise; if (!best || candidate.value > best.value) best = candidate; } } return best || { x: 2, rotation: 0 }; }
    function updateCpu() { if (settings.mode !== "cpu" || cpu.gameOver || match.over) return; if (!cpu.aiMove) { cpu.aiMove = chooseCpuMove(cpu); cpu.aiWait = 90 + (9 - settings.cpuLevel) * 8; } if (cpu.aiWait > 0) { cpu.aiWait--; return; } const target = cpu.aiMove; let currentRotation = [0, 1, 2, 3].findIndex((r) => cpu.current.dx === [0, 1, 0, -1][r] && cpu.current.dy === [-1, 0, 1, 0][r]); if (currentRotation < 0) currentRotation = 0; if (currentRotation !== target.rotation) { rotatePair(cpu, 1); return; } if (cpu.current.x < target.x) { movePair(cpu, 1, 0); return; } if (cpu.current.x > target.x) { movePair(cpu, -1, 0); return; } while (movePair(cpu, 0, 1)); const result = placePair(cpu); sendGarbage(player, result); cpu.aiMove = null; }
    function updatePlayer() { if (player.gameOver || match.over) return; if (once.has("arrowleft")) movePair(player, -1, 0); if (once.has("arrowright")) movePair(player, 1, 0); if (once.has("z")) rotatePair(player, -1); if (once.has("x")) rotatePair(player, 1); if (once.has(" ")) { while (movePair(player, 0, 1)); const result = placePair(player); sendGarbage(cpu, result); player.frame = 0; } const interval = held.has("arrowdown") ? 4 : DROP_FRAMES; if (player.frame % interval === 0 && !movePair(player, 0, 1)) { player.lockDelay++; if (player.lockDelay >= 1) { player.lockDelay = 0; const result = placePair(player); sendGarbage(cpu, result); player.frame = 0; } } else if (player.current) player.lockDelay = 0; player.frame++; }
    function updateMatch() { const ended = settings.mode === "cpu" ? player.gameOver || cpu.gameOver : player.gameOver; if (!match.over && ended) { match.over = true; match.winner = player.gameOver ? (settings.mode === "cpu" ? "CPU" : "GAME") : "PLAYER"; statusEl.textContent = match.winner + " WIN"; } }
    function roundedRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath(); }
    function drawBlob(x, y, color, alpha = 1) { ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = COLORS[color]; roundedRect(x + 2, y + 2, CELL - 4, CELL - 4, 12); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.beginPath(); ctx.ellipse(x + CELL * .36, y + CELL * .34, CELL * .14, CELL * .12, 0, 0, Math.PI * 2); ctx.fill(); if (color !== GARBAGE) { ctx.fillStyle = "#17202b"; ctx.strokeStyle = "#17202b"; ctx.lineWidth = 2; ctx.beginPath(); if (color === 0) { ctx.moveTo(x + 9, y + 17); ctx.lineTo(x + 16, y + 19); ctx.moveTo(x + 22, y + 19); ctx.lineTo(x + 29, y + 17); } else if (color === 1) { ctx.moveTo(x + 9, y + 19); ctx.quadraticCurveTo(x + 13, y + 16, x + 17, y + 19); ctx.moveTo(x + 21, y + 19); ctx.quadraticCurveTo(x + 25, y + 16, x + 29, y + 19); } else { ctx.arc(x + 13, y + 20, color === 2 ? 3.8 : 3.2, 0, Math.PI * 2); ctx.arc(x + 25, y + 20, color === 2 ? 3.8 : 3.2, 0, Math.PI * 2); } ctx.stroke(); if (color !== 1) { ctx.fillStyle = "#17202b"; ctx.beginPath(); ctx.arc(x + 13, y + 20, color === 2 ? 3.8 : 3.2, 0, Math.PI * 2); ctx.arc(x + 25, y + 20, color === 2 ? 3.8 : 3.2, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x + 12, y + 19, 1, 0, Math.PI * 2); ctx.arc(x + 24, y + 19, 1, 0, Math.PI * 2); ctx.fill(); } ctx.beginPath(); if (color === 0) { ctx.arc(x + 19, y + 28, 5, Math.PI + .2, Math.PI * 2 - .2); } else if (color === 1) { ctx.moveTo(x + 15, y + 27); ctx.lineTo(x + 23, y + 27); } else if (color === 2) { ctx.arc(x + 19, y + 24, 6, 0.1, Math.PI - .1); } else if (color === 3) { ctx.arc(x + 19, y + 27, 4, 0, Math.PI * 2); } else { ctx.arc(x + 19, y + 26, 5, Math.PI + .15, Math.PI * 2 - .15); } ctx.stroke(); } ctx.restore(); }
    function drawBoard(game, x) { const boardW = COLS * CELL; ctx.fillStyle = "rgba(10,22,36,.75)"; roundedRect(x - 14, BOARD_Y - 14, boardW + 28, VISIBLE_ROWS * CELL + 28, 18); ctx.fill(); ctx.fillStyle = "rgba(220,244,255,.14)"; for (let y = 0; y < VISIBLE_ROWS; y++) for (let col = 0; col < COLS; col++) ctx.fillRect(x + col * CELL, BOARD_Y + y * CELL, CELL - 1, CELL - 1); const offset = ROWS - VISIBLE_ROWS; for (let y = offset; y < ROWS; y++) for (let col = 0; col < COLS; col++) if (game.board[y][col] !== null) drawBlob(x + col * CELL, BOARD_Y + (y - offset) * CELL, game.board[y][col]); if (game.current && !game.gameOver) for (const c of cells(game.current)) if (c.y >= offset) drawBlob(x + c.x * CELL, BOARD_Y + (c.y - offset) * CELL, c.color, .92); }
    function drawPanel(game, x) { ctx.fillStyle = "#17202b"; ctx.font = "800 24px Trebuchet MS"; ctx.fillText(game.name, x, 44); ctx.font = "700 18px Trebuchet MS"; ctx.fillText("SCORE " + game.score, x, 72); ctx.fillText("CHAIN " + game.chain, x, 98); ctx.font = "700 16px Trebuchet MS"; ctx.fillText("GARBAGE " + game.garbage, x, 124); ctx.fillText("NEXT", x + 110, 70); if (game.next) { drawBlob(x + 112, 78, game.next.c2, .95); drawBlob(x + 112, 116, game.next.c1, .95); } }
    function render(time) { const g = ctx.createLinearGradient(0, 0, 0, canvas.height); g.addColorStop(0, "#dcf4ff"); g.addColorStop(1, "#8dcbe6"); ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.ellipse(180 + Math.sin(time * .0003) * 12, 86, 140, 42, 0, 0, Math.PI * 2); ctx.ellipse(930 + Math.cos(time * .00025) * 18, 96, 180, 52, 0, 0, Math.PI * 2); ctx.fill(); const boardX = settings.mode === "cpu" ? 120 : 330; drawPanel(player, boardX); drawBoard(player, boardX); if (settings.mode === "cpu") { drawPanel(cpu, 690); drawBoard(cpu, 690); } drawEffects(); ctx.fillStyle = "#f1f8ff"; ctx.fillRect(0, 620, canvas.width, 80); if (match.over) { ctx.fillStyle = "rgba(7,14,25,.58)"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "800 54px Trebuchet MS"; ctx.fillText(match.winner + " WIN", canvas.width / 2, 340); ctx.font = "700 24px Trebuchet MS"; ctx.fillText("R を押して再戦", canvas.width / 2, 380); ctx.textAlign = "left"; } }
    function loop(time) { updatePlayer(); updateCpu(); updateMatch(); updateEffects(); once.clear(); render(time); requestAnimationFrame(loop); }
    window.addEventListener("keydown", (event) => { const key = event.key.toLowerCase(); if (["arrowleft", "arrowright", "arrowdown", "z", "x", " ", "r"].includes(key)) event.preventDefault(); if (!held.has(key)) once.add(key); held.add(key); if (key === "r") resetMatch(); });
    window.addEventListener("keyup", (event) => held.delete(event.key.toLowerCase()));
    modeEl.addEventListener("change", () => { settings.mode = modeEl.value; resetMatch(); });
    cpuLevelEl.addEventListener("change", () => { settings.cpuLevel = Number(cpuLevelEl.value); resetMatch(); });
    garbageEl.addEventListener("change", () => { settings.garbage = garbageEl.checked; resetMatch(); });
    startButton.addEventListener("click", () => { document.body.classList.add("started"); resetMatch(); });
    /* Touch controls */
    const repeatKeys = new Set(["arrowleft", "arrowright", "arrowdown"]);
    const repeatTimers = {};
    const REPEAT_DELAY = 180, REPEAT_INTERVAL = 60;
    function touchKeyDown(key) {
      if (key === "r") { resetMatch(); return; }
      if (!held.has(key)) once.add(key);
      held.add(key);
      if (repeatKeys.has(key)) {
        clearTimeout(repeatTimers[key]);
        repeatTimers[key] = setTimeout(function tick() {
          once.add(key);
          repeatTimers[key] = setTimeout(tick, REPEAT_INTERVAL);
        }, REPEAT_DELAY);
      }
    }
    function touchKeyUp(key) {
      held.delete(key);
      clearTimeout(repeatTimers[key]);
      delete repeatTimers[key];
    }
    document.querySelectorAll(".touch-btn").forEach((btn) => {
      const key = btn.dataset.key;
      btn.addEventListener("touchstart", (e) => { e.preventDefault(); btn.classList.add("active"); touchKeyDown(key); }, { passive: false });
      btn.addEventListener("touchend", (e) => { e.preventDefault(); btn.classList.remove("active"); touchKeyUp(key); }, { passive: false });
      btn.addEventListener("touchcancel", (e) => { btn.classList.remove("active"); touchKeyUp(key); });
      btn.addEventListener("mousedown", (e) => { e.preventDefault(); btn.classList.add("active"); touchKeyDown(key); });
      btn.addEventListener("mouseup", (e) => { btn.classList.remove("active"); touchKeyUp(key); });
      btn.addEventListener("mouseleave", () => { btn.classList.remove("active"); touchKeyUp(key); });
    });
    resetMatch(); requestAnimationFrame(loop);
  </script>
</body>
